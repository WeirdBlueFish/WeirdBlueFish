name: Generate Snake

on:
  # هر ۲۴ ساعت خودکار اجرا میشه
  schedule:
    - cron: "0 0 * * *" 
  # اجازه میده دستی هم اجراش کنی
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - uses: Platane/snk@v3
        with:
          # نام کاربری گیت‌هاب خودت رو اینجا بنویس
          github_user_name: WeirdBlueFish
          outputs: dist/github-contribution-grid-snake.svg
          
      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
